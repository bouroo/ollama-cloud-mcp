name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `lts/*` tracks the Active LTS automatically, so CI always tests the
      # version LTS users actually run. The tradeoff is deliberate: a new LTS
      # landing upstream changes what CI runs without a commit. package.json
      # declares no `engines` floor, so nothing is claimed that CI does not test.
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The published artifact is this bundle, so drive the full MCP handshake
      # against a copy sitting alone in a directory — no node_modules to fall
      # back on. This is what makes "zero runtime dependencies" a tested claim.
      - name: Built bundle serves MCP standalone
        run: |
          mkdir -p "$RUNNER_TEMP/standalone"
          cp dist/index.js "$RUNNER_TEMP/standalone/"
          node "$RUNNER_TEMP/standalone/index.js" --version
          SMOKE_ENTRY="$RUNNER_TEMP/standalone/index.js" node scripts/smoke.mjs

      - name: End-to-end stdio handshake (from source build)
        run: node scripts/smoke.mjs
