name: Release

on:
  release:
    types: [published]
  # Re-run a failed publish without cutting a new release.
  workflow_dispatch:

permissions:
  contents: read
  # Required to mint the OIDC token that backs the provenance attestation.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # registry-url must be set explicitly for NODE_AUTH_TOKEN to be picked up.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::release tag '$TAG' does not match package.json version 'v$VERSION'"
            exit 1
          fi
          echo "Tag $TAG matches package.json version $VERSION"

      - name: Version is not already on npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published — bump the version first"
            exit 1
          fi
          echo "$NAME@$VERSION is not yet published"

      # prepack repeats these, but failing here gives a clearer signal than a
      # publish failure, and nothing reaches npm unless all three pass.
      - name: Type-check, test and build
        run: bun run typecheck && bun run test && bun run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
