name: Release

on:
  release:
    types: [published]
  # Re-run a failed publish without cutting a new release.
  workflow_dispatch:

permissions:
  contents: read
  # Mints the OIDC token that npm exchanges for short-lived publish credentials.
  # This is what replaces a long-lived NPM_TOKEN secret.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node 22.14+ is the documented floor for trusted publishing. registry-url
      # is still set explicitly so npm targets the public registry.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/

      # The npm bundled with setup-node is usually older than trusted publishing
      # requires, so upgrade it and fail loudly if it is still too old — an old
      # npm shows up as a confusing 404 on publish rather than a clear error.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          REQUIRED=11.5.1
          ACTUAL="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$REQUIRED" "$ACTUAL" | sort -V | head -n1)" != "$REQUIRED" ]; then
            echo "::error::npm $ACTUAL is older than $REQUIRED, which trusted publishing requires"
            exit 1
          fi
          echo "npm $ACTUAL supports trusted publishing"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::release tag '$TAG' does not match package.json version 'v$VERSION'"
            exit 1
          fi
          echo "Tag $TAG matches package.json version $VERSION"

      - name: Version is not already on npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published — bump the version first"
            exit 1
          fi
          echo "$NAME@$VERSION is not yet published"

      # prepack repeats these, but failing here gives a clearer signal than a
      # publish failure, and nothing reaches npm unless all three pass.
      - name: Type-check, test and build
        run: bun run typecheck && bun run test && bun run build

      # No NODE_AUTH_TOKEN: npm exchanges this job's OIDC token for short-lived
      # publish credentials and attaches a provenance attestation automatically.
      # The trusted publisher grants stage-publish only, so this uploads into npm's
      # staging area; nothing moves "latest" until a maintainer approves it with
      # 2FA, which is what defers proof-of-presence out of CI.
      - name: Stage the publish over OIDC
        run: npm stage publish --access public

      # Surface the stage id: approving it is the manual half of this flow, and
      # hunting it out of the log is the obvious papercut.
      - name: Report what is staged
        if: always()
        run: |
          {
            echo "### Staged for approval"
            echo ""
            echo "Approve with \`npm stage approve <id>\` (requires 2FA), or reject with \`npm stage reject <id>\`."
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm stage list >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "(npm stage list unavailable in CI)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
